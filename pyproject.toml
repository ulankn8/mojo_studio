[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toystudio"
version = "0.1.4"
description = "Той Студия: auto-editing of celebration videos"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "psutil",
    "numpy",
    "opencv-python-headless",
    "onnxruntime~=1.31",
    "comtypes; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "mypy", "import-linter"]
spikes = [
    "python-mpv",
    "faster-whisper",
    "ctranslate2",
    "transformers",
    "jiwer",
    "numpy",
    "opencv-python-headless",
    "anthropic",
    "jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["toystudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "toystudio.core.*"
strict = true
